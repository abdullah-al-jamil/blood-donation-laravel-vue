services:
  - type: web
    name: lifedrop-api
    runtime: php
    region: oregon
    rootDir: backend
    buildCommand: |
      cp .env.example .env
      composer install --no-dev --optimize-autoloader
      php artisan key:generate --force
      touch database/database.sqlite
      php artisan migrate --force
      php artisan storage:link
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://lifedrop-api.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FRONTEND_URL
        value: https://lifedrop-frontend.onrender.com
    disk:
      name: storage
      mountPath: /opt/render/project/src/backend/storage
      sizeGB: 1
